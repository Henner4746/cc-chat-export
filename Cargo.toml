[package]
name = "cc-chat-export"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Henner4746/cc-chat-export"
description = "Export Claude desktop Code-tab chats to Markdown"

[dependencies]
eframe = "0.37"
rfd = "0.17"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
strip = true
